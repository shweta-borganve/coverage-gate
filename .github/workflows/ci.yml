name: 🚦 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: 🎨 Lint and format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 📦 Install dependencies
        run: pip install -r requirements-dev.txt
      - name: 🔍 Ruff lint
        run: ruff check .
      - name: ⚫ Black format check
        run: black --check .
      - name: 🧹 isort import check
        run: isort --check-only .
      - name: 🔎 Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          cache: false

  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 📦 Install dependencies
        run: pip install -r requirements-dev.txt
      - name: 🧪 Run tests with coverage
        run: |
          pytest --cov=src --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:coverage.info \
            --cov-report=term-missing
      - name: 🚧 Dogfood Coverage Gate on XML report
        if: matrix.python-version == '3.12'
        uses: ./
        with:
          coverage-file: coverage.xml
          threshold: "80"
      - name: 🧬 Dogfood Coverage Gate on LCOV report
        if: matrix.python-version == '3.12'
        uses: ./
        with:
          coverage-file: coverage.info
          threshold: "80"
      - name: 📤 Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.info
          retention-days: 14

  workflow-security:
    name: 🔐 Workflow security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🌈 Scan workflows with zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          inputs: .github/workflows
          min-severity: medium
          version: v1.31.1
      - name: 🔒 Check immutable action references
        uses: joshjohanning/ensure-immutable-actions@aaa3ba61b950ead2be895ea36a561a5eb11dd82b # v2.7.2
        with:
          exclude-workflows: published-action-smoke.yml

  action-smoke:
    name: 💨 Action smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ✅ Passes within threshold and regression limit
        id: pass
        uses: ./
        with:
          coverage-file: tests/fixtures/sample.xml
          threshold: "80"
          baseline-coverage: "89"
          max-regression: "5"
      - name: 🔢 Verify coverage output
        env:
          COVERAGE: ${{ steps.pass.outputs.coverage }}
        run: test "$COVERAGE" = "85.0"
      - name: 🧬 Passes with LCOV report
        id: lcov-pass
        uses: ./
        with:
          coverage-file: tests/fixtures/sample.info
          threshold: "70"
      - name: 🔢 Verify LCOV coverage output
        env:
          COVERAGE: ${{ steps.lcov-pass.outputs.coverage }}
        run: test "$COVERAGE" = "75.0"
      - name: 📉 Fails below threshold
        id: below
        continue-on-error: true
        uses: ./
        with:
          coverage-file: tests/fixtures/sample.xml
          threshold: "90"
      - name: 🔻 Fails on regression
        id: regression
        continue-on-error: true
        uses: ./
        with:
          coverage-file: tests/fixtures/sample.xml
          threshold: "80"
          baseline-coverage: "95"
          max-regression: "5"
      - name: 🕳️ Fails on missing report
        id: missing
        continue-on-error: true
        uses: ./
        with:
          coverage-file: tests/fixtures/does-not-exist.xml
          threshold: "80"
      - name: 🎯 Verify expected failures
        run: |
          test "${{ steps.below.outcome }}" = "failure"
          test "${{ steps.regression.outcome }}" = "failure"
          test "${{ steps.missing.outcome }}" = "failure"

  docker:
    name: 🐳 Docker build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗️ Build image
        run: docker build -t coverage-gate:ci .
      - name: ▶️ Run CLI in the image
        run: docker run --rm coverage-gate:ci tests/fixtures/sample.xml 80
      - name: 🧪 Run tests in the container
        run: docker compose run --build --rm tests

  dependency-audit:
    name: 🛡️ Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 📦 Install pip-audit
        run: pip install pip-audit
      - name: 🔐 Audit dependencies
        run: pip-audit -r requirements.txt

  checks-passed:
    name: 🏁 All checks passed
    if: always()
    needs: [lint, test, workflow-security, action-smoke, docker, dependency-audit]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all jobs to succeed
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
