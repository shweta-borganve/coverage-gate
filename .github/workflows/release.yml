name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: coverage-gate
          permission-contents: write
          permission-workflows: write

      - name: Update major version tag
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          latest_release_tag="$(
            git tag --list |
              grep -E '^v1\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ "$latest_release_tag" == v1.* ]]; then
            git tag --force v1 "$latest_release_tag"

            auth_header="$(
              printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0
            )"

            git \
              -c http.https://github.com/.extraheader= \
              -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
              push origin refs/tags/v1 --force

            echo "Updated v1 to $latest_release_tag"
          else
            echo "No v1 release found; leaving v1 unchanged."
          fi
