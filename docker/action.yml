name: 'Coverage Gate (Docker)'
description: 'Docker-based action to check Cobertura XML, LCOV, or coverage.py JSON coverage and fail below threshold'

inputs:
  coverage-file:
    description: 'Path to the Cobertura XML, LCOV, or coverage.py JSON report'
    required: true

  threshold:
    description: 'Minimum allowed coverage percentage'
    required: false
    default: '80'

  changed-lines-threshold:
    description: 'Minimum allowed coverage percentage for changed lines'
    required: false
    default: '0'

  warning-margin:
    description: 'Coverage warning margin in percentage points'
    required: false
    default: '5'

  baseline-coverage:
    description: 'Baseline coverage percentage for regression detection'
    required: false
    default: ''

  max-regression:
    description: 'Maximum allowed coverage regression in percentage points'
    required: false
    default: '5'

  enable-coverage-badge:
    description: 'Generate an SVG coverage badge'
    required: false
    default: 'false'

  badge-output-path:
    description: 'Output path for the SVG coverage badge, relative to the workspace'
    required: false
    default: 'coverage-badge.svg'

outputs:
  coverage:
    description: 'Current coverage percentage'

  changed-lines-coverage:
    description: 'Coverage percentage for changed lines'

  changed-lines-passed:
    description: 'Whether the changed-line coverage check passed'

  passed:
    description: 'Whether the overall coverage check passed'

runs:
  using: 'docker'
  image: 'Dockerfile'
