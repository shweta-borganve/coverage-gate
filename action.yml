name: 'Coverage Gate'
feature/public-release-preparation
author: 'Shweta Boraganve'
description: 'Check coverage reports and enforce global, changed-line, and component-specific thresholds'

branding:
  icon: 'activity'
  color: 'blue'

description: 'Check coverage reports and enforce global, changed-line, and component-specific thresholds'
main

inputs:
  coverage-file:
    description: 'Path to the coverage report'
    required: true

  threshold:
    description: 'Minimum allowed coverage percentage'
    required: true
    default: '80'

  component-thresholds:
    description: 'Optional JSON object mapping repository-relative files or directories to minimum coverage percentages, e.g. {"src/api/": 90, "src/database/": 85}'
    required: false
    default: ''

  changed-lines-threshold:
    description: 'Minimum allowed coverage percentage for changed lines'
    required: false
    default: '0'

  warning-margin:
    description: 'Coverage warning margin in percentage points'
    required: false
    default: '5'

  baseline-coverage:
    description: 'Baseline coverage percentage for regression detection'
    required: false
    default: ''

  max-regression:
    description: 'Maximum allowed coverage regression in percentage points'
    required: false
    default: '5'

  github-token:
    description: 'GitHub token used to create or update pull request comments'
    required: false
    default: ''

  enable-pr-comment:
    description: 'Enable or disable pull request coverage comments'
    required: false
    default: 'true'

  enable-coverage-trend:
    description: 'Enable coverage history tracking using GitHub Actions artifacts'
    required: false
    default: 'false'

  history-token:
    description: 'GitHub token with Actions read permission for retrieving coverage history'
    required: false
    default: ''

  enable-coverage-badge:
    description: 'Generate an SVG coverage badge'
    required: false
    default: 'false'

  badge-output-path:
    description: 'Output path for the SVG coverage badge, relative to the workspace'
    required: false
    default: 'coverage-badge.svg'

outputs:
  coverage:
    description: 'Current coverage percentage'
    value: ${{ steps.run-coverage.outputs.coverage }}

  threshold:
    description: 'Required coverage threshold'
    value: ${{ steps.run-coverage.outputs.threshold }}

  passed:
    description: 'Whether the coverage check passed'
    value: ${{ steps.run-coverage.outputs.passed }}

  changed-lines-coverage:
    description: 'Coverage percentage for changed lines'
    value: ${{ steps.run-coverage.outputs.changed-lines-coverage }}

  changed-lines-passed:
    description: 'Whether the changed-line coverage check passed'
    value: ${{ steps.run-coverage.outputs.changed-lines-passed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'

    - name: Run Coverage Gate
      id: run-coverage
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ENABLE_PR_COMMENT: ${{ inputs.enable-pr-comment }}
        ACTION_PATH: ${{ github.action_path }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        COMPONENT_THRESHOLDS: ${{ inputs.component-thresholds }}
        CHANGED_LINES_THRESHOLD: ${{ inputs.changed-lines-threshold }}
        WARNING_MARGIN: ${{ inputs.warning-margin }}
        BASELINE_COVERAGE: ${{ inputs.baseline-coverage }}
        MAX_REGRESSION: ${{ inputs.max-regression }}
        ENABLE_COVERAGE_TREND: ${{ inputs.enable-coverage-trend }}
        HISTORY_TOKEN: ${{ inputs.history-token || github.token }}
        COVERAGE_HISTORY_BRANCH: ${{ github.head_ref || github.ref_name }}
        COVERAGE_HISTORY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        HISTORY_OUTPUT_PATH: ${{ runner.temp }}/coverage-gate-history.json
        ENABLE_COVERAGE_BADGE: ${{ inputs.enable-coverage-badge }}
        BADGE_OUTPUT_PATH: ${{ inputs.badge-output-path }}
      run: |
        set -e
        cd "$ACTION_PATH"
        echo "[Coverage Gate] Starting coverage check..."
        python -m src.main --github-action

    - name: Upload coverage history
      if: ${{ always() && inputs.enable-coverage-trend == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-gate-history
        path: ${{ runner.temp }}/coverage-gate-history.json
        if-no-files-found: ignore
        retention-days: 90
      continue-on-error: true
