name: 'Coverage Gate'
description: 'Check Cobertura XML coverage and fail below threshold'

inputs:
  coverage-file:
    description: 'Path to the Cobertura XML coverage report'
    required: true

  threshold:
    description: 'Minimum allowed coverage percentage'
    required: true
    default: '80'

  warning-margin:
    description: 'Coverage warning margin in percentage points'
    required: false
    default: '5'

  baseline-coverage:
    description: 'Baseline coverage percentage for regression detection'
    required: false
    default: ''

  max-regression:
    description: 'Maximum allowed coverage regression in percentage points'
    required: false
    default: '5'

outputs:
  coverage:
    description: 'Current coverage percentage'
    value: ${{ steps.run-coverage.outputs.coverage }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e
        echo "[Coverage Gate] Installing dependencies..."
        cd "$ACTION_PATH"
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        echo "[Coverage Gate] Dependencies installed successfully."

    - name: Run Coverage Gate
      id: run-coverage
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_EVENT_NAME: ${{ github.event_name }}
        ACTION_PATH: ${{ github.action_path }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        WARNING_MARGIN: ${{ inputs.warning-margin }}
        BASELINE_COVERAGE: ${{ inputs.baseline-coverage }}
        MAX_REGRESSION: ${{ inputs.max-regression }}
      run: |
        set -e
        cd "$ACTION_PATH"
        echo "[Coverage Gate] Starting coverage check..."
        python -m src.main --github-action