name: 'Coverage Gate'
description: 'Check Cobertura XML coverage and fail below threshold'

inputs:
  coverage-file:
    description: 'Path to the Cobertura XML coverage report'
    required: true

  threshold:
    description: 'Minimum allowed coverage percentage'
    required: true
    default: '80'

  warning-margin:
    description: 'Coverage warning margin in percentage points'
    required: false
    default: '5'

  baseline-coverage:
    description: 'Baseline coverage percentage for regression detection'
    required: false
    default: ''

  max-regression:
    description: 'Maximum allowed coverage regression in percentage points'
    required: false
    default: '5'

outputs:
  coverage:
    description: 'Current coverage percentage'
    value: ${{ steps.run-coverage.outputs.coverage }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e
        echo "[Coverage Gate] Installing dependencies..."
        cd "$ACTION_PATH"
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        echo "[Coverage Gate] Dependencies installed successfully."

    - name: Run Coverage Gate
      id: run-coverage
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_EVENT_NAME: ${{ github.event_name }}
        ACTION_PATH: ${{ github.action_path }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        WARNING_MARGIN: ${{ inputs.warning-margin }}
        BASELINE_COVERAGE: ${{ inputs.baseline-coverage }}
        MAX_REGRESSION: ${{ inputs.max-regression }}
      run: |
        set -e
        cd "$ACTION_PATH"

        echo "[Coverage Gate] Starting coverage check..."

        python - <<'PY'
        import os
        import subprocess

        from src.changed_coverage import (
            ChangedCoverageReport,
            generate_changed_coverage_report,
        )
        from src.changed_lines import parse_changed_lines
        from src.enforcer import enforce
        from src.parser import parse_cobertura, parse_line_coverage
        from src.summary import generate_summary

        workspace = os.environ["GITHUB_WORKSPACE"]
        coverage_file = os.path.join(
            workspace,
            os.environ["COVERAGE_FILE"],
        )
        threshold = float(os.environ["COVERAGE_THRESHOLD"])
        warning_margin = float(os.environ["WARNING_MARGIN"])

        baseline_text = os.environ["BASELINE_COVERAGE"]
        baseline_coverage = float(baseline_text) if baseline_text else None
        max_regression = float(os.environ["MAX_REGRESSION"])

        print("[Coverage Gate] Configuration loaded.")
        print(f"[Coverage Gate] Coverage report: {coverage_file}")
        print(f"[Coverage Gate] Required threshold: {threshold:.2f}%")
        print(f"[Coverage Gate] Warning margin: {warning_margin:.2f}%")

        if baseline_coverage is not None:
            print(
                "[Coverage Gate] Baseline coverage: "
                f"{baseline_coverage:.2f}%"
            )
            print(
                "[Coverage Gate] Maximum allowed regression: "
                f"{max_regression:.2f} percentage points"
            )
        else:
            print("[Coverage Gate] Baseline regression check is not configured.")

        print("[Coverage Gate] Reading Cobertura XML report...")
        metrics = parse_cobertura(coverage_file)
        print("[Coverage Gate] Coverage report parsed successfully.")

        print("[Coverage Gate] Evaluating coverage rules...")
        result = enforce(
            metrics,
            threshold,
            warning_margin,
            baseline_coverage,
            max_regression,
        )

        print(f"[Coverage Gate] Measured line coverage: {result.coverage:.2f}%")
        print(f"[Coverage Gate] {result.message}")

        changed_coverage = ChangedCoverageReport(
            available=False,
            files=[],
            message=(
                "Changed-code coverage not available: "
                "pull request diff is unavailable."
            ),
        )

        if os.environ.get("PR_EVENT_NAME") == "pull_request":
            print("[Coverage Gate] Checking changed-code coverage...")

            base_sha = os.environ.get("PR_BASE_SHA")
            head_sha = os.environ.get("PR_HEAD_SHA")

            if base_sha and head_sha:
                try:
                    print(
                        "[Coverage Gate] Comparing pull request changes "
                        "with the base revision..."
                    )

                    diff_result = subprocess.run(
                        [
                            "git",
                            "diff",
                            "--unified=0",
                            f"{base_sha}...{head_sha}",
                            "--",
                        ],
                        cwd=workspace,
                        check=True,
                        capture_output=True,
                        text=True,
                    )

                    changed_lines = parse_changed_lines(diff_result.stdout)
                    print("[Coverage Gate] Changed lines identified.")

                    print(
                        "[Coverage Gate] Reading line-level coverage data..."
                    )
                    line_coverage = parse_line_coverage(
                        coverage_file,
                        root_dir=workspace,
                    )

                    changed_coverage = generate_changed_coverage_report(
                        changed_lines,
                        line_coverage,
                    )

                    print(
                        "[Coverage Gate] Changed-code coverage analysis "
                        "completed."
                    )
                    print(f"[Coverage Gate] {changed_coverage.message}")

                except (OSError, ValueError, subprocess.SubprocessError) as exc:
                    print(
                        "[Coverage Gate] WARNING: Changed-code coverage "
                        f"could not be calculated: {exc}"
                    )

                    changed_coverage = ChangedCoverageReport(
                        available=False,
                        files=[],
                        message=(
                            "Changed-code coverage not available: "
                            "unable to read the pull request diff "
                            "or line-level coverage data."
                        ),
                    )
            else:
                print(
                    "[Coverage Gate] WARNING: Base or head commit SHA is "
                    "unavailable; skipping changed-code coverage."
                )
        else:
            print(
                "[Coverage Gate] Not a pull request event; "
                "skipping changed-code coverage."
            )

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

        if summary_path:
            print("[Coverage Gate] Writing GitHub Actions step summary...")
            with open(summary_path, "a", encoding="utf-8") as summary_file:
                summary_file.write(
                    generate_summary(
                        result,
                        metrics.file_coverage,
                        changed_coverage,
                    )
                )
            print("[Coverage Gate] Step summary written successfully.")
        else:
            print(
                "[Coverage Gate] GitHub Actions summary path is unavailable."
            )

        print("[Coverage Gate] Publishing coverage output...")
        with open(
            os.environ["GITHUB_OUTPUT"],
            "a",
            encoding="utf-8",
        ) as output:
            output.write(f"coverage={result.coverage}\n")

        if not result.passed:
            print("[Coverage Gate] RESULT: FAILED")
            raise SystemExit(1)

        print("[Coverage Gate] RESULT: PASSED")
        PY
