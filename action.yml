name: 'Coverage Gate'
description: 'Check Cobertura XML or LCOV coverage and fail below threshold'

inputs:
  coverage-file:
    description: 'Path to the Cobertura XML (.xml) or LCOV (.info) coverage report'
    required: true

  threshold:
    description: 'Minimum allowed coverage percentage'
    required: true
    default: '80'

  warning-margin:
    description: 'Coverage warning margin in percentage points'
    required: false
    default: '5'

  baseline-coverage:
    description: 'Baseline coverage percentage for regression detection'
    required: false
    default: ''

  max-regression:
    description: 'Maximum allowed coverage regression in percentage points'
    required: false
    default: '5'

outputs:
  coverage:
    description: 'Current coverage percentage'
    value: ${{ steps.run-coverage.outputs.coverage }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e
        cd "$ACTION_PATH"
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run Coverage Gate
      id: run-coverage
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_EVENT_NAME: ${{ github.event_name }}
        ACTION_PATH: ${{ github.action_path }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        WARNING_MARGIN: ${{ inputs.warning-margin }}
        BASELINE_COVERAGE: ${{ inputs.baseline-coverage }}
        MAX_REGRESSION: ${{ inputs.max-regression }}
      run: |
        set -e
        cd "$ACTION_PATH"

        python - <<'PY'
        import logging
        import os
        import subprocess
        import sys
        from pathlib import Path

        from src.changed_coverage import (
            ChangedCoverageReport,
            generate_changed_coverage_report,
        )
        from src.changed_lines import parse_changed_lines
        from src.enforcer import enforce
        from src.parser import parse_coverage_report, parse_line_coverage
        from src.summary import generate_summary

        logging.basicConfig(
            level=logging.INFO,
            format="%(levelname)s: %(message)s",
            stream=sys.stdout,
        )
        logger = logging.getLogger("coverage-gate")


        def main():
            workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
            coverage_path = Path(os.environ["COVERAGE_FILE"])

            if not coverage_path.is_absolute():
                coverage_path = workspace / coverage_path

            threshold = float(os.environ["COVERAGE_THRESHOLD"])
            warning_margin = float(os.environ["WARNING_MARGIN"])

            baseline_text = os.environ["BASELINE_COVERAGE"]
            baseline_coverage = float(baseline_text) if baseline_text else None
            max_regression = float(os.environ["MAX_REGRESSION"])

            logger.info("Reading coverage report: %s", coverage_path)
            metrics = parse_coverage_report(
                str(coverage_path),
                root_dir=workspace,
            )

            logger.info("Evaluating coverage rules.")
            result = enforce(
                metrics,
                threshold,
                warning_margin,
                baseline_coverage,
                max_regression,
            )
            logger.info("%s", result.message)

            changed_coverage = ChangedCoverageReport(
                available=False,
                files=[],
                message=(
                    "Changed-code coverage not available: "
                    "pull request diff is unavailable."
                ),
            )

            if os.environ.get("PR_EVENT_NAME") == "pull_request":
                base_sha = os.environ.get("PR_BASE_SHA")
                head_sha = os.environ.get("PR_HEAD_SHA")

                if base_sha and head_sha:
                    try:
                        logger.info("Calculating changed-code coverage.")
                        diff_result = subprocess.run(
                            [
                                "git",
                                "diff",
                                "--unified=0",
                                f"{base_sha}...{head_sha}",
                                "--",
                            ],
                            cwd=workspace,
                            check=True,
                            capture_output=True,
                            text=True,
                        )

                        changed_lines = parse_changed_lines(diff_result.stdout)
                        line_coverage = parse_line_coverage(
                            str(coverage_path),
                            root_dir=workspace,
                        )

                        changed_coverage = generate_changed_coverage_report(
                            changed_lines,
                            line_coverage,
                        )
                    except (
                        OSError,
                        ValueError,
                        subprocess.SubprocessError,
                    ) as error:
                        logger.warning(
                            "Changed-code coverage unavailable: %s",
                            error,
                        )
                        changed_coverage = ChangedCoverageReport(
                            available=False,
                            files=[],
                            message=(
                                "Changed-code coverage not available: "
                                "unable to read the pull request diff "
                                "or line-level coverage data."
                            ),
                        )

            summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

            if summary_path:
                logger.info("Writing GitHub Actions step summary.")
                with open(
                    summary_path,
                    "a",
                    encoding="utf-8",
                ) as summary_file:
                    summary_file.write(
                        generate_summary(
                            result,
                            metrics.file_coverage,
                            changed_coverage,
                        )
                    )

            with open(
                os.environ["GITHUB_OUTPUT"],
                "a",
                encoding="utf-8",
            ) as output:
                output.write(f"coverage={result.coverage}\n")

            if not result.passed:
                logger.error("Coverage Gate failed.")
                raise SystemExit(1)

            logger.info("Coverage Gate passed.")
            return 0


        if __name__ == "__main__":
            try:
                sys.exit(main())
            except (OSError, ValueError) as error:
                logger.error("Coverage Gate error: %s", error)
                sys.exit(1)
        PY
