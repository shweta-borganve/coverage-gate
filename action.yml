name: 'Coverage Gate'
description: 'Check Cobertura XML coverage and fail below threshold'

inputs:
  coverage-file:
    description: 'Path to the Cobertura XML coverage report'
    required: true

  threshold:
    description: 'Minimum allowed coverage percentage'
    required: true
    default: '80'

  warning-margin:
    description: 'Coverage warning margin in percentage points'
    required: false
    default: '5'

outputs:
  coverage:
    description: 'Current coverage percentage'
    value: ${{ steps.run-coverage.outputs.coverage }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run coverage gate
      id: run-coverage
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        python - <<'PY'
        import os
        from src.parser import parse_cobertura
        from src.enforcer import enforce

        coverage_file = "${{ github.workspace }}/${{ inputs.coverage-file }}"
        threshold = float("${{ inputs.threshold }}")
        warning_margin = float("${{ inputs.warning-margin }}")

        metrics = parse_cobertura(coverage_file)
        result = enforce(metrics, threshold, warning_margin)

        print(result.message)

        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"coverage={result.coverage}\n")

        if not result.passed:
            raise SystemExit(1)
        PY